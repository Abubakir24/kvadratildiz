<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kvadrat ildizlar usuli</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#dcdcd6;--ac:#2f6fed;--acx:#fff;--ok:#0f7b45;--er:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222221;--tx:#ecece8;--mu:#9a9a94;--bd:#3a3a37;--ac:#6b9bff;--acx:#10131a;--ok:#5fd48f;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#171716;--card:#222221;--tx:#ecece8;--mu:#9a9a94;--bd:#3a3a37;--ac:#6b9bff;--acx:#10131a;--ok:#5fd48f;--er:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.05rem;margin:1.2em 0 .4em}
p.mu{color:var(--mu);margin:.2em 0 .8em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px}
input.c{width:74px;text-align:center}
.sc{overflow-x:auto}
table{border-collapse:collapse;margin:6px 0}
td,th{padding:4px 10px;text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.m td{border-left:1px solid var(--tx);border-right:0}.m{border-left:2px solid var(--tx);border-right:2px solid var(--tx);border-radius:6px}
.m td{border:0}
.res{font-size:1.05rem}.ok{color:var(--ok)}.er{color:var(--er)}
.x{font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>
<main>
<h1>Kvadrat ildizlar usuli</h1>
<p class="mu">A·X = B sistemani S<sup>T</sup>·S = A yoʻli bilan yechadi. Simmetrik boʻlmasa, avtomatik simmetrizatsiya qiladi.</p>

<div class="card">
<div class="row">
<label>Oʻzgaruvchilar soni n:
<select id="n"></select></label>
</div>
<div class="row" style="margin-top:10px">
<label>Variant V: <input id="v" class="c" type="number" value="8"></label>
<button class="g" data-n="3">3×3</button>
<button class="g" data-n="4">4×4</button>
<button class="g" data-n="5">5×5</button>
<button class="g" data-n="6">6×6</button>
<button class="g" data-n="7">7×7</button>
<button id="bc">Tozalash</button>
</div>
<p class="mu">V ni kiriting va oʻlchamni tanlang, tenglamalar oʻzi joylashadi (3×3 va 5×5 topshiriqdagi tenglamalar, 4×4, 6×6, 7×7 namunaviy). Yoki qiymatlarni qoʻlda kiriting.</p>
<div class="sc"><div id="grid"></div></div>
<div class="row" style="margin-top:10px"><button class="p" id="go">Hisoblash</button></div>
</div>

<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const ns=$("n");for(let i=2;i<=8;i++){const o=document.createElement("option");o.value=i;o.textContent=i;ns.appendChild(o)}
ns.value=3;

function grid(n,A,B){
  let h='<table><tr><th></th>';
  for(let j=0;j<n;j++)h+=`<th>x${j+1}</th>`;
  h+='<th>=</th></tr>';
  for(let i=0;i<n;i++){
    h+=`<tr><th>${i+1}-tenglama</th>`;
    for(let j=0;j<n;j++)h+=`<td><input class="c" id="a${i}_${j}" type="number" step="any" value="${A?A[i][j]:''}"></td>`;
    h+=`<td><input class="c" id="b${i}" type="number" step="any" value="${B?B[i]:''}"></td></tr>`;
  }
  $("grid").innerHTML=h+'</table>';
}
function sys3(V){return{A:[[V,-(V+2),V+3],[V+3,-V,V-1],[-(V+2),V+3,-V]],B:[4*V+12,7*V-1,-V-2]}}
function sys5(V){return{A:[
[V+1,V+2,-V,4*V,-V],[V+4,-2*V,3*V,-V,4*V],[V+2,V+4,-(V+1),V+1,-(V+3)],
[V+3,V+5,-(V+1),V+2,-(V+4)],[V,V+1,V+2,V+3,V+4]],B:[7*V+7,25*V+20,V+3,2*V+8,15*V+27]}}
function fill(s){const n=s.B.length;ns.value=n;grid(n,s.A,s.B);$("out").innerHTML=""}
function sysN(V,n){const A=[],B=[];for(let i=0;i<n;i++){A.push([]);let b=0;for(let j=0;j<n;j++){const a=i===j?V+20:((3*i+2*j)%7)-3;A[i].push(a);b+=a*(j+1)}B.push(b)}return{A,B}}
document.querySelectorAll("button.g").forEach(b=>b.onclick=()=>{const n=+b.dataset.n,V=+$("v").value;fill(n===3?sys3(V):n===5?sys5(V):sysN(V,n))});
$("bc").onclick=()=>{grid(+ns.value);$("out").innerHTML=""};
ns.onchange=()=>{grid(+ns.value);$("out").innerHTML=""};
grid(3);

const f=(v,d=4)=>{let s=v.toFixed(d);return /^-0\.0*$/.test(s)?s.slice(1):s};
function mat(M,d=4){return '<div class="sc"><table class="m">'+M.map(r=>'<tr>'+r.map(v=>`<td>${f(v,d)}</td>`).join('')+'</tr>').join('')+'</table></div>'}
function vec(v,d=4){return mat(v.map(x=>[x]),d)}

function cholS(A){
  const n=A.length,S=A.map(()=>Array(n).fill(0));
  for(let i=0;i<n;i++){
    let t=A[i][i];for(let k=0;k<i;k++)t-=S[k][i]**2;
    if(t<=1e-12)return null;
    S[i][i]=Math.sqrt(t);
    for(let j=i+1;j<n;j++){let y=A[i][j];for(let k=0;k<i;k++)y-=S[k][i]*S[k][j];S[i][j]=y/S[i][i]}
  }
  return S;
}
function detG(M){
  const n=M.length;M=M.map(r=>r.slice());let d=1;
  for(let i=0;i<n;i++){
    let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;
    if(Math.abs(M[p][i])<1e-12)return 0;
    if(p!==i){[M[p],M[i]]=[M[i],M[p]];d=-d}
    d*=M[i][i];
    for(let r=i+1;r<n;r++){const k=M[r][i]/M[i][i];for(let c=i;c<n;c++)M[r][c]-=k*M[i][c]}
  }
  return d;
}

$("go").onclick=()=>{
  const n=+ns.value,out=$("out");
  const A=[],B=[];
  for(let i=0;i<n;i++){
    A.push([]);
    for(let j=0;j<n;j++){const v=parseFloat($(`a${i}_${j}`).value);if(isNaN(v)){out.innerHTML='<div class="card er">Barcha koeffitsiyentlarni kiriting.</div>';return}A[i].push(v)}
    const b=parseFloat($(`b${i}`).value);if(isNaN(b)){out.innerHTML='<div class="card er">Barcha ozod hadlarni kiriting.</div>';return}B.push(b);
  }
  let M=A.map(r=>r.slice()),R=B.slice(),sim=false;
  const symm=M.every((r,i)=>r.every((v,j)=>Math.abs(v-M[j][i])<1e-9));
  let S=symm?cholS(M):null;
  if(!S){
    sim=true;
    M=A.map((_,i)=>A.map((_,j)=>A.reduce((s,r)=>s+r[i]*r[j],0)));
    R=A.map((_,i)=>A.reduce((s,r,k)=>s+r[i]*B[k],0));
    S=cholS(M);
  }
  if(!S){out.innerHTML='<div class="card er">Matritsa maxsus (det A = 0), usulni qoʻllab boʻlmaydi.</div>';return}
  const Y=[];
  for(let i=0;i<n;i++){let t=R[i];for(let k=0;k<i;k++)t-=S[k][i]*Y[k];Y[i]=t/S[i][i]}
  const X=Array(n).fill(0);
  for(let i=n-1;i>=0;i--){let t=Y[i];for(let k=i+1;k<n;k++)t-=S[i][k]*X[k];X[i]=t/S[i][i]}
  let det=1;for(let i=0;i<n;i++)det*=S[i][i]**2;
  const dA=detG(A);
  let h='';
  h+=`<div class="card"><h2>1. ${sim?'Simmetrik matritsaga aylantirilgan A (Ā = AᵀA)':'A matritsa (u simmetrik va musbat aniqlangan)'}</h2>${mat(M,2)}`;
  h+=`<p class="mu">Ozod hadlar${sim?' (B̄ = AᵀB)':''}:</p>${vec(R,2)}</div>`;
  h+=`<div class="card"><h2>2. S matritsa (SᵀS = ${sim?'Ā':'A'})</h2>${mat(S)}</div>`;
  h+=`<div class="card"><h2>3. Y vektor (SᵀY = ${sim?'B̄':'B'})</h2>${vec(Y)}</div>`;
  h+=`<div class="card res"><h2>4. Yechimlar (SX = Y)</h2><div class="x">`+X.map((v,i)=>`x${i+1} = ${f(v,6)}`).join('<br>')+`</div></div>`;
  h+=`<div class="card res"><h2>5. Determinant</h2><div class="x">`;
  if(sim){h+=`det(Ā) = s₁₁²·s₂₂²·…·sₙₙ² = ${f(det,4)}<br>|det A| = √det(Ā) = ${f(Math.sqrt(det),4)}<br>det A (ishorasi bilan) = ${f(dA,4)}`}
  else h+=`det(A) = s₁₁²·s₂₂²·…·sₙₙ² = ${f(det,4)}`;
  h+=`</div></div>`;
  const res=A.map((r,i)=>Math.abs(r.reduce((s,v,j)=>s+v*X[j],0)-B[i]));
  const mx=Math.max(...res);
  h+=`<p class="mu">Tekshiruv: asl sistemaga qoʻyilganda eng katta xatolik ${mx.toExponential(2)}${mx<1e-6?' <span class="ok">✓</span>':''}</p>`;
  out.innerHTML=h;
};
</script>
</body>
</html>
